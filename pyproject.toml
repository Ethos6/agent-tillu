[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tillu"
version = "0.2.1"
description = "AI coworkers that run entirely on your own computer, with an Action Firewall in front of every action."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "croniter>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
desktop = ["pywebview>=5.0", "pyinstaller>=6.0", "playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.44"]

[project.scripts]
agent-tillu = "tillu.__main__:main"
agent-tillu-desktop = "tillu.desktop:main"

[tool.setuptools]
packages = ["tillu"]

[tool.setuptools.package-data]
tillu = ["web/*"]
