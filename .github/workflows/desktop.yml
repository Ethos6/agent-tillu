name: Desktop builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev pkg-config python3-dev
          pip install pygobject
      - run: pip install -e ".[desktop]" pillow
      - run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tillu-${{ runner.os }}
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
